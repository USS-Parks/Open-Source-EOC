# OpenEOC single node: PostgreSQL/PostGIS, the API, and Caddy in front of both
# serving HTTPS, the web bundle and the map archives. Run install.sh, which
# writes deploy/.env. Air-gap friendly: images are pinned by version tag and
# can be pre-loaded with `docker load`; nothing here calls out at runtime
# except Caddy's ACME certificate requests when an ACME email is chosen.

# Container logs rotate by size: five files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: openeoc_owner
      POSTGRES_PASSWORD: ${OPENEOC_DB_PASSWORD:-change-me-in-.env}
      POSTGRES_DB: openeoc
    volumes:
      - openeoc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeoc_owner -d openeoc"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Owner connection: runs migrations and seeds templates.
      OPENEOC_DATABASE_URL: postgres://openeoc_owner:${OPENEOC_DB_PASSWORD:-change-me-in-.env}@db:5432/openeoc
      # App connection: app_runtime, so Row-Level Security applies. The API
      # refuses to start without it; install.sh sets the role's password and
      # writes this URL to deploy/.env (see deploy/README.md, "The two
      # database identities").
      OPENEOC_RUNTIME_URL: ${OPENEOC_RUNTIME_URL:-}
      # Server-side secret key for credential envelopes (IPAWS, collab, Jitsi).
      OPENEOC_SECRET_KEY: ${OPENEOC_SECRET_KEY:-}
      # Uploaded file blobs live on disk, not in Postgres. Persist them in a
      # named volume so they survive container recreation and are backed up
      # (see deploy/backup.sh); without this the store is the ephemeral
      # container layer and every upload is lost on the next `up`.
      OPENEOC_DATA_DIR: /data/blobs
      # Upload limits in megabytes: one file, and all files of one jurisdiction.
      OPENEOC_MAX_UPLOAD_MB: ${OPENEOC_MAX_UPLOAD_MB:-25}
      OPENEOC_JURISDICTION_QUOTA_MB: ${OPENEOC_JURISDICTION_QUOTA_MB:-10240}
      HOST: 0.0.0.0
      PORT: 8080
      # Logs are JSON lines on stdout (see deploy/README.md, "Logs and metrics").
      OPENEOC_LOG_LEVEL: ${OPENEOC_LOG_LEVEL:-info}
      OPENEOC_SLOW_REQUEST_MS: ${OPENEOC_SLOW_REQUEST_MS:-1000}
      # Unset leaves GET /api/v1/metrics answering 404.
      OPENEOC_METRICS_TOKEN: ${OPENEOC_METRICS_TOKEN:-}
      # Caddy's X-Forwarded-For names the client. Only Caddy on this network
      # and this host's loopback reach the API, and both have private
      # addresses, so private addresses are the trusted proxies.
      OPENEOC_TRUST_PROXY: ${OPENEOC_TRUST_PROXY:-uniquelocal}
      # Offline address search, when install.sh fetched a gazetteer; a missing
      # file logs a warning and search reports unavailable.
      OPENEOC_GAZETTEER_PATH: ${OPENEOC_GAZETTEER_PATH:-/basemap/gazetteer.tsv}
    # Loopback only: clients reach the API through Caddy over HTTPS.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - openeoc-blobs:/data/blobs
      - ./basemap:/basemap:ro
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    depends_on: [api]
    environment:
      OPENEOC_DOMAIN: ${OPENEOC_DOMAIN:?run install.sh, or set OPENEOC_DOMAIN in deploy/.env}
      OPENEOC_TLS: ${OPENEOC_TLS:?run install.sh, or set OPENEOC_TLS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./basemap:/srv/basemap:ro
      - ./tls:/etc/openeoc/tls:ro
      # Certificates and the ACME account; keep them across recreation.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  openeoc-db:
  openeoc-blobs:
  caddy-data:
  caddy-config:
