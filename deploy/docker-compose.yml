# OpenEOC single-node reference (VEOC-40). Postgres/PostGIS plus the API.
# Air-gap friendly: images are pinned by digest-able tags and can be
# pre-loaded with `docker load`; nothing here calls out at runtime. The web
# bundle is built with `pnpm --filter @openeoc/web build` and served by any
# static host (an nginx service is shown commented below).

# Container logs rotate by size: five files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: openeoc_owner
      POSTGRES_PASSWORD: ${OPENEOC_DB_PASSWORD:-change-me-in-.env}
      POSTGRES_DB: openeoc
    volumes:
      - openeoc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeoc_owner -d openeoc"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Owner connection: runs migrations and seeds templates.
      OPENEOC_DATABASE_URL: postgres://openeoc_owner:${OPENEOC_DB_PASSWORD:-change-me-in-.env}@db:5432/openeoc
      # App connection: app_runtime, so Row-Level Security applies. The API
      # refuses to start without it; install.sh sets the role's password and
      # writes this URL to deploy/.env (see deploy/README.md, "The two
      # database identities").
      OPENEOC_RUNTIME_URL: ${OPENEOC_RUNTIME_URL:-}
      # Server-side secret key for credential envelopes (IPAWS, collab, Jitsi).
      OPENEOC_SECRET_KEY: ${OPENEOC_SECRET_KEY:-}
      # Uploaded file blobs live on disk, not in Postgres. Persist them in a
      # named volume so they survive container recreation and are backed up
      # (see deploy/backup.sh); without this the store is the ephemeral
      # container layer and every upload is lost on the next `up`.
      OPENEOC_DATA_DIR: /data/blobs
      # Upload limits in megabytes: one file, and all files of one jurisdiction.
      OPENEOC_MAX_UPLOAD_MB: ${OPENEOC_MAX_UPLOAD_MB:-25}
      OPENEOC_JURISDICTION_QUOTA_MB: ${OPENEOC_JURISDICTION_QUOTA_MB:-10240}
      HOST: 0.0.0.0
      PORT: 8080
      # Logs are JSON lines on stdout (see deploy/README.md, "Logs and metrics").
      OPENEOC_LOG_LEVEL: ${OPENEOC_LOG_LEVEL:-info}
      OPENEOC_SLOW_REQUEST_MS: ${OPENEOC_SLOW_REQUEST_MS:-1000}
      # Unset leaves GET /api/v1/metrics answering 404.
      OPENEOC_METRICS_TOKEN: ${OPENEOC_METRICS_TOKEN:-}
      # Set to the reverse proxy address when one fronts the API; unset trusts none.
      OPENEOC_TRUST_PROXY: ${OPENEOC_TRUST_PROXY:-}
    ports:
      - "8080:8080"
    volumes:
      - openeoc-blobs:/data/blobs
    restart: unless-stopped
    logging: *logging

  # web:
  #   image: nginx:1.27-alpine
  #   volumes:
  #     - ../web/dist:/usr/share/nginx/html:ro
  #   ports:
  #     - "8081:80"
  #   depends_on: [api]

volumes:
  openeoc-db:
  openeoc-blobs:
